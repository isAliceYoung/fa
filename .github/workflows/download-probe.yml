name: D1 existing Chromium download baseline probe
on:
  push:
    branches: [feature/private-deploy-isolation]
    paths: ['tests/download_probe*', '.github/workflows/download-probe.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: staging-debian12-5c9ceecfb3e8b07b449ac55c9080c16f0a9b7a76
          run-id: 39711127801
          github-token: ${{ github.token }}
          path: .test-results
      - name: Independent hash of the unchanged R1 baseline package
        run: echo '0acbfe2664314a4565a2554fe2ebc7959e4e384cd805339de7f5317fce971a64  .test-results/staging-runtime.tar.gz' | sha256sum -c -
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Disposable observer tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage fonts-noto-cjk
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Real old-code GUI download (diagnosis only, not D1 acceptance)
        run: python3 tests/run_systemd_vm.py --staging --download-audit --ram-mib=2048 --vcpus=2 --disk-gib=20 --swap-mib=1024
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-baseline-download-probe
          path: .test-results/staging-vm/
