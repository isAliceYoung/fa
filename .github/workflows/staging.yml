name: Staging Debian 12 artifact and installation
on:
  push:
    branches: [feature/private-deploy-isolation, feature/CC]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  artifact:
    if: (github.ref == 'refs/heads/feature/private-deploy-isolation' || github.ref == 'refs/heads/feature/CC') && !contains(github.event.head_commit.message, '[d1-focus]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: current, revision: '' }
          - { kind: baseline, revision: f195f90c01f38fcf93c20ee616f9e62a15063018 }
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - name: Debian build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl xz-utils python3 build-essential postgresql
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Build without installing any runtime on the target VPS
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          AUTO_UPDATE: '0'
          UPDATE_RESTART: '0'
          NEXT_PUBLIC_WD_COMMIT: ${{ github.sha }}
        run: |
          git config --global --add safe.directory "$PWD"
          build_sha="$(git rev-parse HEAD)"
          export NEXT_PUBLIC_WD_COMMIT="$build_sha"
          pg_ctlcluster 15 main start
          npm ci --include=dev --no-audit --no-fund
          node webdesktop-deploy/scripts/bootstrap.cjs create-env "$PWD"
          node webdesktop-deploy/scripts/bootstrap.cjs database "$PWD"
          # 4B-2: versioned migrations; the pinned baseline revision predates them.
          if [ -f tests/ci_db_init.mjs ]; then node tests/ci_db_init.mjs; else ./node_modules/.bin/drizzle-kit push --force; fi
          npm run build
          npm run typecheck
          mkdir -p .test-results
          # The current build records its real branch (4B-1); the baseline revision's own script has no --branch.
          python3 webdesktop-deploy/scripts/staging_bundle.py --repo "$PWD" --commit "$build_sha" --node "$(command -v node)" ${{ matrix.kind == 'current' && format('--branch {0}', github.ref_name) || '' }} --output .test-results/staging-runtime.tar.gz > .test-results/staging-artifact.json
          sha256sum .test-results/staging-runtime.tar.gz > .test-results/staging-runtime.sha256
          cat .test-results/staging-runtime.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kind == 'baseline' && 'staging-baseline-f195f90' || format('staging-debian12-{0}', github.sha) }}
          path: |
            .test-results/staging-runtime.tar.gz
            .test-results/staging-runtime.sha256
            .test-results/staging-artifact.json
          retention-days: 7
  download-smoke:
    # D1-R2-C: the full D1 download suite, health and an actual reboot must
    # pass on 1 GiB / 1 vCPU with and without swap (the failing class) before
    # the install matrix is scheduled; the original 2 GiB gate is retained.
    name: Targeted visible Chromium download gate (${{ matrix.ram }}-${{ matrix.cpus }}-${{ matrix.swap }})
    needs: artifact
    # [4b1-gate]/[4b2-gate] iterate on the release/database install matrix only.
    if: ${{ !contains(github.event.head_commit.message, '[4b1-gate]') && !contains(github.event.head_commit.message, '[4b2-gate]') }}
    strategy:
      fail-fast: false
      # [c2-focus] iterates on 2 GiB only; every other push keeps all three.
      matrix:
        include: ${{ fromJSON(contains(github.event.head_commit.message, '[c2-focus]') && '[{"ram":2048,"cpus":2,"disk":20,"swap":1024}]' || '[{"ram":2048,"cpus":2,"disk":20,"swap":1024},{"ram":1024,"cpus":1,"disk":10,"swap":1024},{"ram":1024,"cpus":1,"disk":10,"swap":0}]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: staging-debian12-${{ github.sha }}
          path: .test-results
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Host observer dependencies only
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Bounded official HTTPS host tools
        timeout-minutes: 8
        run: bash tests/prepare_vm_host.sh --fonts
      - name: Actual GUI download before scheduling the full resource matrix
        env:
          # Iteration tags select suites; untagged (frozen) runs use every suite.
          WD_SUITES: ${{ contains(github.event.head_commit.message, '[c2-focus]') && 'c2' || contains(github.event.head_commit.message, '[c2-gate]') && 'c1,c2' || 'd1,c1,c2' }}
        run: python3 tests/run_systemd_vm.py --staging --download-focus --ram-mib=${{ matrix.ram }} --vcpus=${{ matrix.cpus }} --disk-gib=${{ matrix.disk }} --swap-mib=${{ matrix.swap }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-smoke-evidence-${{ matrix.ram }}-${{ matrix.cpus }}-${{ matrix.swap }}
          path: .test-results/staging-vm/
  install:
    name: ${{ matrix.isolated && 'isolated-4a' || matrix.baseline && 'staging-baseline' || 'staging' }} (${{ matrix.ram }}-${{ matrix.cpus }}-${{ matrix.swap }})
    needs: [artifact, download-smoke]
    # Iteration commits stop at the gate; the frozen-SHA run executes all.
    if: ${{ !cancelled() && needs.artifact.result == 'success' && (needs.download-smoke.result == 'success' || (needs.download-smoke.result == 'skipped' && (contains(github.event.head_commit.message, '[4b1-gate]') || contains(github.event.head_commit.message, '[4b2-gate]')))) && !contains(github.event.head_commit.message, '[c1-gate]') && !contains(github.event.head_commit.message, '[c2-focus]') && !contains(github.event.head_commit.message, '[c2-gate]') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(github.event.head_commit.message, '[4b2-gate]') && '[{"ram":1024,"cpus":1,"disk":10,"swap":1024,"isolated":true},{"ram":1024,"cpus":1,"disk":10,"swap":0,"isolated":true},{"ram":2048,"cpus":2,"disk":20,"swap":1024,"isolated":true},{"ram":4096,"cpus":4,"disk":30,"swap":1024,"isolated":true},{"ram":4096,"cpus":4,"disk":30,"swap":1024},{"ram":1024,"cpus":1,"disk":10,"swap":1024,"baseline":true}]' || contains(github.event.head_commit.message, '[4b1-gate]') && '[{"ram":1024,"cpus":1,"disk":10,"swap":1024,"isolated":true},{"ram":1024,"cpus":1,"disk":10,"swap":0,"isolated":true},{"ram":2048,"cpus":2,"disk":20,"swap":1024,"isolated":true},{"ram":1024,"cpus":1,"disk":10,"swap":1024,"baseline":true}]' || '[{"ram":1024,"cpus":1,"disk":10,"swap":1024},{"ram":2048,"cpus":2,"disk":20,"swap":1024},{"ram":4096,"cpus":4,"disk":30,"swap":1024},{"ram":1024,"cpus":1,"disk":10,"swap":0},{"ram":1024,"cpus":1,"disk":10,"swap":1024,"baseline":true},{"ram":1024,"cpus":1,"disk":10,"swap":1024,"isolated":true},{"ram":1024,"cpus":1,"disk":10,"swap":0,"isolated":true},{"ram":2048,"cpus":2,"disk":20,"swap":1024,"isolated":true},{"ram":4096,"cpus":4,"disk":30,"swap":1024,"isolated":true}]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.baseline && 'staging-baseline-f195f90' || format('staging-debian12-{0}', github.sha) }}
          path: .test-results
      - uses: actions/download-artifact@v4
        # 4B-1: second fixed version for independent prepared-release tests.
        if: ${{ matrix.isolated }}
        with:
          name: staging-baseline-f195f90
          path: .test-results/baseline
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Host browser automation dependencies (never copied to VPS)
        if: ${{ !matrix.baseline }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bounded official HTTPS host tools
        timeout-minutes: 8
        run: bash tests/prepare_vm_host.sh --fonts
      - name: Real fresh Debian 12 staged install and reboot for the selected specification
        env:
          WD_SUITES: ${{ (contains(github.event.head_commit.message, '[4b1-gate]') || contains(github.event.head_commit.message, '[4b2-gate]')) && 'none' || 'd1,c1,c2' }}
        run: python3 tests/run_systemd_vm.py ${{ matrix.isolated && '--isolated' || '--staging' }} --ram-mib=${{ matrix.ram }} --vcpus=${{ matrix.cpus }} --disk-gib=${{ matrix.disk }} --swap-mib=${{ matrix.swap }} ${{ matrix.baseline && '--baseline' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.isolated && 'isolated-install-evidence' || 'staging-install-evidence' }}-${{ matrix.ram }}-${{ matrix.cpus }}-${{ matrix.swap }}${{ matrix.baseline && '-baseline' || '' }}
          path: .test-results/${{ matrix.isolated && 'isolated' || 'staging' }}-vm/
