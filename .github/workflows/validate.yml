name: Validate deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Obsolete development runs never count as coverage of a newer fixed SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Check every tracked shell script
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z -- '*.sh')
      - name: Check Python and Node helpers
        run: |
          python3 -m compileall -q webdesktop-deploy/patches webdesktop-deploy/scripts guest-runtime pty-runtime gui-runtime tests
          node --check webdesktop-deploy/scripts/bootstrap.cjs
          node tests/terminal_actions_checks.mjs
          node tests/ws_origin_checks.mjs
          node tests/http_boundary_checks.mjs
      - name: Test repeated installation protection
        run: |
          python3 tests/run_tests.py --json /tmp/webdesktop-test-results.json
          node tests/resource_monitor_test.mjs
          node tests/status_admission_test.mjs
          node tests/terminal_ime_test.mjs
          node tests/download_observation_test.mjs
          node tests/rfb_key_packets_test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regular-tests-ubuntu
          path: /tmp/webdesktop-test-results.json

  debian12-scripts:
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - name: Install Debian test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git openssh-client util-linux ca-certificates python3 curl xz-utils
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Validate Debian 12 script logic
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z -- '*.sh')
          python3 -m compileall -q webdesktop-deploy/patches webdesktop-deploy/scripts guest-runtime pty-runtime gui-runtime tests
          node --check webdesktop-deploy/scripts/bootstrap.cjs
          node tests/terminal_actions_checks.mjs
          node tests/ws_origin_checks.mjs
          node tests/http_boundary_checks.mjs
          python3 tests/run_tests.py --json /tmp/webdesktop-test-results.json
          node tests/resource_monitor_test.mjs
          node tests/status_admission_test.mjs
          node tests/terminal_ime_test.mjs
          node tests/download_observation_test.mjs
          node tests/rfb_key_packets_test.mjs
      - name: Real root/non-root source permissions and local Git (test keys only)
        run: python3 tests/linux_private_repo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regular-tests-debian12
          path: |
            /tmp/webdesktop-test-results.json
            /tmp/webdesktop-source-permissions.json

  guest-3a-debian12:
    if: ${{ !contains(github.event.head_commit.message, '[d1-focus]') }}
    runs-on: ubuntu-24.04
    container:
      image: debian:12
      options: --privileged
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AUTO_UPDATE: '0'
      UPDATE_RESTART: '0'
    steps:
      - name: Install disposable Debian lab tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 openssh-client openssh-server util-linux iproute2 e2fsprogs strace ca-certificates curl build-essential libssl-dev postgresql systemd nftables
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Validate experimental guest network policy without applying it
        run: |
          nft -c -f tests/gui_probe_network.nft
          nft -c -f webdesktop-deploy/templates/webdesktop-browser.nft
      - name: Prepare isolated test database and build
        shell: bash
        run: |
          pg_isready -h 127.0.0.1 -p 5432 || pg_ctlcluster 15 main start
          npm ci --include=dev --no-audit --no-fund
          node webdesktop-deploy/scripts/bootstrap.cjs create-env "$PWD"
          node webdesktop-deploy/scripts/bootstrap.cjs database "$PWD"
          ./node_modules/.bin/drizzle-kit push --force
          npm run build
          npm run typecheck
      - name: Create disposable service and guest identities
        shell: bash
        run: |
          bash webdesktop-deploy/scripts/setup-guest-layer.sh --lab
          bash webdesktop-deploy/scripts/setup-guest-layer.sh --lab
          bash webdesktop-deploy/scripts/setup-guest-volume.sh --lab
          bash webdesktop-deploy/scripts/setup-guest-volume.sh --lab
          systemd-analyze verify webdesktop-deploy/templates/webdesktop-guest.service webdesktop-deploy/templates/webdesktop-guest.socket
          workspace_owner="$(stat -c %u "$PWD")"
          chown -R root:wdsvc "$PWD"
          chmod -R o-rwx "$PWD"
          chmod -R g+rX "$PWD"
          chmod 640 .env
          # Preserve the trusted host runner's traversal for Docker cleanup.
          chown "$workspace_owner":wdsvc "$PWD"
      - name: Real Linux UID, filesystem, IPC, authenticated Next.js and database tests
        run: python3 tests/linux_guest_layer.py
      - name: SSH parser ordering and administrator configuration regression
        run: python3 tests/linux_tunnel_parser.py
      - name: Real Next.js WebSocket Upgrade authentication and lifecycle
        run: python3 tests/linux_ws_runtime.py
      - name: Real guest files, streaming, recovery, ZIP and kernel storage capacity
        run: python3 tests/linux_files_runtime.py
      - name: Actual terminal UID attacks against file agent, transactions and Next.js
        run: python3 tests/linux_terminal_boundary.py
      - name: Real status authentication isolation, flood, cancellation and database recovery
        run: python3 tests/linux_status_runtime.py
      - name: Package private test backend for disposable PTY VM (no env or keys)
        shell: bash
        run: |
          cp -L "$(command -v node)" /tmp/wd-test-node
          tar --exclude='.next/cache' -czf /tmp/pty-backend.tar.gz .next node_modules package.json next.config.ts server.mjs scripts/network-policy.mjs scripts/internal-http.mjs scripts/ws-origin-policy.mjs scripts/http-boundary.mjs src/lib/pty-gateway.mjs src/lib/gui-gateway.mjs src/lib/resource-monitor.mjs src/lib/status-admission.mjs src/components/desktop/terminal-input.mjs drizzle.config.ts src/db/schema.ts public -C /tmp --transform='s,^wd-test-node$,node,' wd-test-node
      - uses: actions/upload-artifact@v4
        with:
          name: private-pty-test-backend
          path: /tmp/pty-backend.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-3a-linux-results
          path: |
            /tmp/webdesktop-3a-results.json
            /tmp/webdesktop-ssh-parser.json
            /tmp/webdesktop-ws-runtime.json
            /tmp/webdesktop-files-runtime.json
            /tmp/webdesktop-same-uid-baseline.json
            /tmp/webdesktop-terminal-boundary.json
            /tmp/webdesktop-status-auth.json

  systemd-debian12-vm:
    if: ${{ !contains(github.event.head_commit.message, '[d1-focus]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install disposable virtual machine tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
      - name: Boot real Debian 12 systemd, exercise units, reboot and destroy VM
        run: python3 tests/run_systemd_vm.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booted-systemd-debian12
          path: .test-results/systemd-vm/

  pty-systemd-debian12-vm:
    if: ${{ !contains(github.event.head_commit.message, '[d1-focus]') }}
    needs: guest-3a-debian12
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - uses: actions/download-artifact@v4
        with:
          name: private-pty-test-backend
          path: .test-results
      - name: Prepare disposable VM and sandboxed browser test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage fonts-noto-cjk
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          tar -xzf .test-results/pty-backend.tar.gz
      - name: Real Debian systemd/cgroup + authenticated Next WebSocket + terminal UI + reboot
        run: python3 tests/run_systemd_vm.py --pty
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pty-systemd-next-ui-debian12
          path: .test-results/pty-vm/

  gui-systemd-debian12-vm:
    if: ${{ !contains(github.event.head_commit.message, '[d1-focus]') }}
    name: gui-systemd-debian12-swap-${{ matrix.swap_mib }}
    strategy:
      fail-fast: false
      matrix:
        swap_mib: [0, 1024]
    needs: guest-3a-debian12
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - uses: actions/download-artifact@v4
        with:
          name: private-pty-test-backend
          path: .test-results
      - name: Prepare one-core disposable GUI VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage fonts-noto-cjk
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          tar -xzf .test-results/pty-backend.tar.gz
      - name: Real 1 vCPU Debian GUI, UID boundaries, Xvnc, PCManFM and browser interaction
        run: python3 tests/run_systemd_vm.py --desktop --swap-mib=${{ matrix.swap_mib }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-desktop-one-core-swap-${{ matrix.swap_mib }}
          path: .test-results/desktop-vm-1024-${{ matrix.swap_mib }}/

  build:
    if: ${{ !contains(github.event.head_commit.message, '[d1-focus]') }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: wd_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wd_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wd_ci -d wd_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wd_ci:ci-only-password@127.0.0.1:5432/wd_ci
      ADMIN_USER: ci-admin
      ADMIN_PATH: ci-admin-entry
      NEXT_TELEMETRY_DISABLED: '1'
      AUTO_UPDATE: '0'
      UPDATE_RESTART: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Generate isolated CI login seeds
        shell: bash
        run: |
          for key in ADMIN_PASSWORD DESKTOP_PASSWORD AUTH_KEY; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: Write isolated CI runtime configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const keys = ['DATABASE_URL', 'ADMIN_USER', 'ADMIN_PASSWORD', 'DESKTOP_PASSWORD', 'ADMIN_PATH', 'AUTH_KEY'];
          const content = keys.map(key => `${key}=${process.env[key]}`).join('\n') + '\n';
          fs.writeFileSync('.env', content, { mode: 0o600 });
          NODE
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Initialize the empty CI database
        run: ./node_modules/.bin/drizzle-kit push --force
      - run: npm run build
      - run: npm run typecheck
      - name: Stock IME A/B evidence and real Chromium xterm input regression
        run: |
          node tests/terminal_ime_diagnose.mjs /tmp/webdesktop-terminal-ime-baseline.json
          node tests/terminal_ime_browser.mjs /tmp/webdesktop-terminal-ime-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-ime-chromium-evidence
          path: /tmp/webdesktop-terminal-ime-*.json
      - name: Check local HTTP and authentication readiness
        shell: bash
        run: |
          BIND_HOST=127.0.0.1 PORT=3000 bash scripts/start.sh > /tmp/webdesktop-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --noproxy '*' -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:3000/api/health; then
              if node webdesktop-deploy/scripts/bootstrap.cjs auth-state "$PWD"; then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            tail -n 80 /tmp/webdesktop-ci.log
            exit 1
          fi
