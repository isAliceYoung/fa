name: Validate deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Check every tracked shell script
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z -- '*.sh')
      - name: Check Python and Node helpers
        run: |
          python3 -m py_compile webdesktop-deploy/patches/fix-deploy.py
          node --check webdesktop-deploy/scripts/bootstrap.cjs
      - name: Test repeated installation protection
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: wd_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wd_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wd_ci -d wd_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wd_ci:ci-only-password@127.0.0.1:5432/wd_ci
      ADMIN_USER: ci-admin
      ADMIN_PATH: ci-admin-entry
      NEXT_TELEMETRY_DISABLED: '1'
      AUTO_UPDATE: '0'
      UPDATE_RESTART: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Generate isolated CI login seeds
        shell: bash
        run: |
          for key in ADMIN_PASSWORD DESKTOP_PASSWORD AUTH_KEY; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: Write isolated CI runtime configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const keys = ['DATABASE_URL', 'ADMIN_USER', 'ADMIN_PASSWORD', 'DESKTOP_PASSWORD', 'ADMIN_PATH', 'AUTH_KEY'];
          const content = keys.map(key => `${key}=${process.env[key]}`).join('\n') + '\n';
          fs.writeFileSync('.env', content, { mode: 0o600 });
          NODE
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Initialize the empty CI database
        run: ./node_modules/.bin/drizzle-kit push --force
      - run: npm run build
      - run: npm run typecheck
      - name: Check local HTTP and authentication readiness
        shell: bash
        run: |
          BIND_HOST=127.0.0.1 PORT=3000 bash scripts/start.sh > /tmp/webdesktop-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --noproxy '*' -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:3000/api/health; then
              if node webdesktop-deploy/scripts/bootstrap.cjs auth-state "$PWD"; then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            tail -n 80 /tmp/webdesktop-ci.log
            exit 1
          fi
