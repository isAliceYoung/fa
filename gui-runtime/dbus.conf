<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <listen>unix:path=/tmp/wd-gui/bus</listen>
  <auth>EXTERNAL</auth>
  <!-- No global service directories: fixed supervised IME is started by the
       GUI worker, never a competing D-Bus-activated process. -->
  <policy context="default">
    <allow user="wdgui"/>
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
